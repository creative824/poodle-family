name: Deploy admin worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/admin-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER: npx --yes wrangler@3.80.0
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to deploy the admin panel."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Find or create the KV namespace
        if: steps.token.outputs.ok == 'true'
        run: |
          id=$($WRANGLER kv namespace list | jq -r '.[] | select(.title == "poodle-admin-CONTENT") | .id')
          if [ -z "$id" ]; then
            $WRANGLER kv namespace create CONTENT
            id=$($WRANGLER kv namespace list | jq -r '.[] | select(.title == "poodle-admin-CONTENT") | .id')
          fi
          test -n "$id"
          sed -i "s/KV_ID/$id/" wrangler.toml
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: $WRANGLER deploy
      - name: Check the admin domain answers
        if: steps.token.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://admin.poodle-family.co.il/public/content || true)
            echo "admin.poodle-family.co.il/public/content -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::Deployed, but admin.poodle-family.co.il is not answering yet."
      - name: Report what the live Worker answers
        if: steps.token.outputs.ok == 'true'
        run: |
          check() { echo "::notice::$1 -> $(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Key: $3" "https://admin.poodle-family.co.il$2") (want $4)"; }
          check "public content" /public/content "" 200
          check "unknown link" /not-the-key "" 404
          check "api with wrong key" /api/content wrong 401
          echo "::notice::admin page source -> $(curl -s -o /dev/null -w '%{http_code}' -L https://creative824.github.io/poodle-family/admin/index.html) (want 200)"
