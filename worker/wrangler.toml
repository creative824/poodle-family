# Deployed by .github/workflows/admin-worker.yml. The KV id is filled in by the
# workflow (it creates the namespace on the first run).
name = "poodle-admin"
main = "admin-worker.js"
compatibility_date = "2024-09-23"
workers_dev = false
routes = [{ pattern = "admin.poodle-family.co.il", custom_domain = true }]

[vars]
# SHA-256 of the secret part of the admin link (the link itself is not in the repo).
ADMIN_KEY_SHA256 = "f49e5f95864ba7878a6b4a80051738da2d0bd6001ee76ab65eacbabbb4669c54"

[[kv_namespaces]]
binding = "CONTENT"
id = "KV_ID"
